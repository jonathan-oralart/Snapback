name: Snapback
options:
  minimumXcodeGenVersion: 2.45.4
  xcodeVersion: "26.4"
  defaultConfig: Release
  deploymentTarget:
    macOS: "26.4"
  groupSortPosition: top
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  PermissionFlow:
    url: https://github.com/jaywcjlove/PermissionFlow
    from: 1.0.0
targets:
  Snapback:
    type: application
    platform: macOS
    sources:
      - path: Snapback
        type: syncedFolder
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      - package: PermissionFlow
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://github.com/jonathan-oralart/snapback/releases/latest/download/appcast.xml
        SUPublicEDKey: Ob3MTl0a7pNAqP09JwDWyTsCV2XfUBY83sxPpCmJa0M=
        SUEnableAutomaticChecks: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: XB5U87PMF7
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Snapback
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: 0.1
        PRODUCT_BUNDLE_IDENTIFIER: com.oralart.snapback
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: 6.0
schemes:
  Snapback:
    build:
      targets:
        Snapback: all
    run:
      config: Debug
    archive:
      config: Release
